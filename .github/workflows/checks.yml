name: Manual repository checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimal simulator test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            numpy==2.2.6 gymnasium==1.4.0 ruff==0.17.1
          python -m pip install --disable-pip-version-check --no-input -e .
      - name: Infrastructure and M1 deterministic simulator checks - no data or training
        run: |
          python scripts/check_project.py
          python -m unittest discover -s tests -v
          python scripts/run_m1_reference.py
          python -m ruff check src/inventory_ejor/envs tests/test_inventory_env.py scripts/run_m1_reference.py
          git diff --check

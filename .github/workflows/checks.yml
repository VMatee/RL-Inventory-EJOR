name: Manual repository checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimal M1/M2 reference test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            numpy==2.2.6 gymnasium==1.4.0 ruff==0.17.1
          python -m pip install --disable-pip-version-check --no-input -e .
      - name: Infrastructure and deterministic M1/M2 checks - no training or data
        run: |
          python scripts/check_project.py
          python -m unittest discover -s tests -v
          python scripts/run_m1_reference.py
          python scripts/run_m2_reference.py --config experiments/configs/m2_tiny.json
          python -m ruff check src/inventory_ejor/envs tests/test_inventory_env.py scripts/run_m1_reference.py
          python -m ruff check --select E,F,I,B,UP src/inventory_ejor/demand src/inventory_ejor/policies src/inventory_ejor/solvers tests/test_m2_reference.py scripts/run_m2_reference.py
          git diff --check
      - name: M3 offline data contracts (synthetic fixtures; no retailer data)
        run: |
          python -m unittest discover -s tests -p 'test_m3*.py' -v
          python -m ruff check --select E,F,I,B,UP src/inventory_ejor/data scripts/prepare_m3.py scripts/audit_m3.py tests/test_m3_data.py tests/test_m3_noninterference.py tests/m3_fixtures.py
          python -m ruff format --check src/inventory_ejor/data scripts/prepare_m3.py scripts/audit_m3.py tests/test_m3_data.py tests/test_m3_noninterference.py tests/m3_fixtures.py

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-inventory-ejor"
version = "0.0.0"
description = "Reproducible research scaffolding for limited-demand-data inventory control"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["inventory_ejor*"]
